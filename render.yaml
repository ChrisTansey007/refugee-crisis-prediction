# Render Blueprint (Docker-Free)
# Validate fields at https://render.com/docs/blueprint-spec

services:
  - type: web
    name: backend-api
    env: python
    plan: free
    branch: main
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: migration-postgres
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          name: migration-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        value: change_me
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: celery-worker
    env: python
    plan: free
    branch: main
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: migration-postgres
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          name: migration-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        value: change_me
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: celery-beat
    env: python
    plan: free
    branch: main
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: migration-postgres
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          name: migration-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        value: change_me
      - key: LOG_LEVEL
        value: INFO

  - type: static_site
    name: frontend
    plan: free
    branch: main
    rootDirectory: frontend
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://backend-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
    redirects:
      - source: "/*"
        destination: "/index.html"
        status: 200

  - type: redis
    name: migration-redis
    plan: free

# Managed PostgreSQL
# (Render creates credentials; we reference them as env vars above)
databases:
  - name: migration-postgres
    databaseName: migration_db
    user: postgres
    plan: free
